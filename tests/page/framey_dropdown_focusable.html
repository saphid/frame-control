  const act=callback=>ReactDOM.flushSync(callback);

    for(const component of [DFL.Dropdown,DFL.DropdownItem]) for(const deferred of [false,true]) {
      const first={data:0,label:'First'},second={data:1,label:'Second'},changes=[];

        onChange:option=>changes.push(option),onMenuWillOpen:deferred ? show=>{loads++;release=show;} : undefined}));

      focusable=false;redraw();
      assert(initial.tabIndex===-1,'focusable=false left dropdown control in tab order');

        act(()=>initial.click());
        let cancel=[...container.querySelectorAll('button')].find(n=>n.textContent==='Cancel loading');
        assert(loads===1&&cancel?.tabIndex===-1&&!container.querySelector('select'),'deferred gate or Cancel tab stop lost');

        focusable=false;redraw();act(()=>cancel.click());act(()=>stale());

        'focusability update replaced select or local focus');
      focusable=false;redraw();
      assert(select.tabIndex===-1&&document.activeElement===select,'tab opt-out unexpectedly blurred current selection');
      act(()=>{select.value='1';select.dispatchEvent(new Event('change',{bubbles:true}));});
      assert(changes.length===1&&changes[0]===second,'original option callback lost');
      selected=1;disabled=true;focusable=false;redraw();
      assert(select.disabled&&select.tabIndex===-1,'disabled select or tab opt-out lost');
      act(()=>{select.value='0';select.dispatchEvent(new Event('change',{bubbles:true}));});
