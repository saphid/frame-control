name: checks

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"   # the oldest python3 the Mac app may pick up (Xcode CLT)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install zsh
        # The runner image's third-party apt sources (packages.microsoft.com) sometimes
        # fail to refresh; Ubuntu's own lists still update, and the install fails if not.
        run: (sudo apt-get update -qq || true) && sudo apt-get install -y -qq zsh
      - name: Script syntax
        run: |
          sh -n ui/local-bin/ssh
          for f in scripts/*.sh frame/*/*.sh; do
            case "$(head -n 1 "$f")" in
              *zsh*) zsh -n "$f" ;;
              *) bash -n "$f" ;;
            esac
          done
      - name: Python compiles
        run: |
          python -m py_compile ui/*.py apk-catalog/*.py frame/android/*.py ios/scripts/*.py
          # Valve's devkit-utils (vendored; run by the Frame's python3). Most have no .py suffix.
          python -m py_compile $(find frame/devkit-utils -type f ! -name '*.*' ! -name LICENSE) frame/devkit-utils/devkit_utils/*.py
      - name: Server tests
        run: python -m unittest discover -s tests -v
      - name: Linux Wireless Adapter doctor (read-only PC smoke)
        run: |
          python ui/frame_wireless_doctor.py --json > "$RUNNER_TEMP/linux-wireless-doctor.json"
          python -c 'import json, os; from pathlib import Path; d=json.loads((Path(os.environ["RUNNER_TEMP"]) / "linux-wireless-doctor.json").read_text()); assert d["supported"] and d["selected"] is None and d["schema"] == 1'
      - name: App syntax
        run: node --check app/main.js && node --check app/obs-source.js && node --check app/build/make-icon.js && node --check app/build/fetch-deps.js && node --check app/preload.js && node --check app/install-link.js && node --check app/updater.js
      - name: App tests
        run: node --test app/test/*.test.js
      - name: Website
        run: node --test site/test/*.test.mjs && node --check site/public/js/site.js && node --check site/public/js/feedback.js

  # The server runs on each desktop OS the app ships for, on the Python version
  # the app bundles (app/build/fetch-deps.js) and, on Ubuntu, a newer one.
  server-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: OBS lifecycle tests
        run: node app/test/obs-source.test.js
      - name: Server tests
        # The dedicated wireless-windows job runs the live inventory on a fresh
        # Windows runner; do not repeat it after the full server suite has
        # consumed this runner's probe budget.
        env:
          FRAME_SKIP_WINDOWS_WIRELESS_LIVE: "1"
        run: python -m unittest discover -s tests -v

  # Fast, PC-only Windows query validation, without capture libraries or a headset.
  wireless-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Wireless doctor fixtures, UI and live read-only Windows inventory
        run: python -m unittest discover -s tests -p 'test_wireless.py' -v

  # The iPhone app: builds for the Simulator and runs its unit tests.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build and test
        run: |
          cd ios
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d for x in d[r] if x["name"].startswith("iPhone")))')
          xcodebuild -project FrameControl.xcodeproj -scheme FrameControl -destination "platform=iOS Simulator,id=$udid" CODE_SIGNING_ALLOWED=NO test

  # End-to-end tests against the fake Frame (tests/fakeframe): Arch Linux ARM
  # in Docker, on a native arm64 runner like the headset. See docs/testing.md.
  e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zsh
        # The runner image's third-party apt sources (packages.microsoft.com) sometimes
        # fail to refresh; Ubuntu's own lists still update, and the install fails if not.
        run: (sudo apt-get update -qq || true) && sudo apt-get install -y -qq zsh
      - name: End-to-end tests
        run: scripts/e2e.sh
