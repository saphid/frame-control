# Diagnostic branch only. Do not merge this replacement workflow into main.
name: Native ARM Terminal observation (diagnostic branch only)

on:
  workflow_dispatch:
    inputs:
      observe:
        description: Run one instrumented observation; never release qualification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: framey-native-unix-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-arm-observation:
    if: github.event_name == 'workflow_dispatch' && inputs.observe && github.ref == 'refs/heads/diagnose/framey-native-arm-unix-nxmf'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Native host and exact source guard
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e dd2223e799bb3db8256285e353d5a0ad2f4bd014^{commit}
      - uses: ./.github/actions/framey-runtime-inputs
      - name: Matching emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
      - name: Exact-main image, isolated Terminal observation and owned cleanup
        run: |
          image="framey-native-observation:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          container="framey-native-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker image rm "$image" >/dev/null 2>&1 || true
            rm -f "$RUNNER_TEMP/native-observation-rootfs.tar"
          }
          trap cleanup EXIT
          git show dd2223e799bb3db8256285e353d5a0ad2f4bd014:tests/decky-runtime/Containerfile.flatpak-vm > "$RUNNER_TEMP/Containerfile.native-observation"
          docker build -q -t "$image" --build-arg KERNEL_PACKAGE=linux-image-arm64 \
            --build-arg 'BROWSER_PACKAGES=chromium chromium-sandbox' \
            -f "$RUNNER_TEMP/Containerfile.native-observation" tests/decky-runtime
          docker image inspect "$image" > "$RUNNER_TEMP/native-observation-image.json"
          docker create --name "$container" --network none --cap-drop ALL --entrypoint /bin/true "$image"
          docker export "$container" > "$RUNNER_TEMP/native-observation-rootfs.tar"
          python3 scripts/framey-observe-native-terminal.py \
            --rootfs-tar "$RUNNER_TEMP/native-observation-rootfs.tar" \
            --loader "$RUNNER_TEMP/framey-runtime-inputs/loader" \
            --output "$RUNNER_TEMP/native-observation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-arm-observation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-observation/
            ${{ runner.temp }}/native-observation-image.json
            ${{ runner.temp }}/Containerfile.native-observation
          if-no-files-found: warn
