name: Decky backend runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decky-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # The full native suite includes 40 primary probes and growing negative
    # controls. Keep room for image build and cleanup without relaxing probes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/framey-runtime-inputs
      - name: Actual Decky 3.3.0 discovery and safe backend probes
        run: python3 scripts/framey-test-decky-runtime.py --loader "$RUNNER_TEMP/framey-runtime-inputs/loader" --output "$RUNNER_TEMP/decky-runtime.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decky-runtime-${{ matrix.os }}
          path: ${{ runner.temp }}/decky-runtime.json
          if-no-files-found: warn

  terminal-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/framey-runtime-inputs
      - name: Test-only Terminal candidate with published Decky 3.3.0
        run: python3 scripts/framey-test-decky-runtime.py --loader "$RUNNER_TEMP/framey-runtime-inputs/loader" --case 65 --terminal-candidate --output "$RUNNER_TEMP/terminal-candidate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-candidate-${{ matrix.os }}
          path: ${{ runner.temp }}/terminal-candidate.json
          if-no-files-found: warn
