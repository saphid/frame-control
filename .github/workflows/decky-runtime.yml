# Diagnostic branch only. Do not merge this replacement workflow into main.
name: Native ARM Terminal observation (diagnostic branch only)

on:
  workflow_dispatch:
    inputs:
      observe:
        description: Run one instrumented observation; never release qualification
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: framey-native-unix-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-arm-observation:
    if: github.event_name == 'workflow_dispatch' && inputs.observe && github.ref == 'refs/heads/diagnose/framey-native-arm-unix-nxmf'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Native host and exact source guard
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e dd2223e799bb3db8256285e353d5a0ad2f4bd014^{commit}
      - uses: ./.github/actions/framey-runtime-inputs
      - name: Matching emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
      - name: Reuse immutable previously audited ARM rootfs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14201758003'
          run-id: '43814749117'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reused-native-rootfs
          merge-multiple: true
      - name: Same image, opt-in loopback boundary observation
        run: |
          python3 -B scripts/framey-observe-native-terminal.py \
            --rootfs-tar "$RUNNER_TEMP/reused-native-rootfs/native-observation-rootfs.tar" \
            --loader "$RUNNER_TEMP/framey-runtime-inputs/loader" \
            --output "$RUNNER_TEMP/native-observation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-arm-observation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-observation/
          if-no-files-found: warn
      # The original rootfs artifact remains the exact input proof, not a new image.
      - name: Remove owned staged copy after evidence upload
        if: always()
        run: rm -f "$RUNNER_TEMP/reused-native-rootfs/native-observation-rootfs.tar"
