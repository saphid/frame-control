name: Android phone app

on:
  push:
    branches: [main]
    paths: ['android/**', 'ios/scripts/make_frame_bundle.py', 'ui/**', '.github/workflows/android-checks.yml']
  pull_request:
    paths: ['android/**', 'ios/scripts/make_frame_bundle.py', 'ui/**', '.github/workflows/android-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build shared-page Android app
        run: android/gradlew -p android --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: frame-control-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
