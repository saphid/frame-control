name: Android phone app

on:
  push:
    branches: [main]
    paths: ['android/**', 'ios/scripts/make_frame_bundle.py', 'ui/**', '.github/workflows/android-checks.yml']
  pull_request:
    paths: ['android/**', 'ios/scripts/make_frame_bundle.py', 'ui/**', '.github/workflows/android-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 16 SDK
        run: |
          sdk=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build shared-page Android app
        run: android/gradlew -p android --no-daemon assembleDebug testDebugUnitTest
      - name: Check the APK contains the compressed Frame bundle
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = next(Path('android/app/build/outputs/apk/debug').glob('*.apk'))
          with zipfile.ZipFile(apk) as archive:
              assert archive.read('assets/frame-bundle.bin')[:2] == b'\x1f\x8b'
              assert len(archive.read('assets/frame-bundle.version').strip()) == 16
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frame-control-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
