plugins { id 'com.android.application' }

android {
    namespace 'com.saphid.framecontrol'
    compileSdk 36
    defaultConfig {
        applicationId 'com.saphid.framecontrol'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/frameAssets').get().asFile
}

def frameAssets = tasks.register('frameAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'android/scripts/make_assets.py', layout.buildDirectory.dir('generated/frameAssets').get().asFile
    inputs.files(fileTree(rootProject.file('../ui')), fileTree(rootProject.file('../scripts')), fileTree(rootProject.file('../frame')), fileTree(rootProject.file('../apk-catalog')) { exclude 'data/**' })
    inputs.file(rootProject.file('../ios/scripts/make_frame_bundle.py'))
    inputs.file(rootProject.file('scripts/make_assets.py'))
    outputs.dir layout.buildDirectory.dir('generated/frameAssets')
}
tasks.named('preBuild').configure { dependsOn frameAssets }

dependencies {
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
